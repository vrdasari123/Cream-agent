name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate project files
        id: project
        run: |
          if [ ! -f pyproject.toml ]; then
            if [ "${{ github.event_name }}" = "push" ]; then
              echo "No Python project files are present on main yet; skipping tests for this bootstrap commit."
              echo "has_project=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "pyproject.toml is required for pull request test runs."
            exit 1
          fi
          echo "has_project=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.project.outputs.has_project == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        if: steps.project.outputs.has_project == 'true'
        run: python -m pytest
