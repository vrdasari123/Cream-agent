[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cream-agent"
version = "0.1.0"
description = "MCP-native trading workspace layer for Robinhood Trading MCP, with durable safety rules, workflows, and local onboarding checks."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cream Agent contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "claude-agent-sdk>=0.2.0",
    "httpx>=0.27",
    "keyring>=24.0",
    "PyYAML>=6.0",
    "yfinance>=0.2.40",
    "anyio>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
cream-agent = "cream_agent.cli.main:run"
cream-agent-doctor = "cream_agent.doctor:main"

[tool.setuptools.packages.find]
include = ["cream_agent*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
